<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether AI UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [aiName, setAiName] = React.useState('Aether');
      const [apiKey, setApiKey] = React.useState('');
      const [isPrivate, setIsPrivate] = React.useState(false);
      const [messages, setMessages] = React.useState([]);
      const [input, setInput] = React.useState('');
      const [preferences, setPreferences] = React.useState(['Tech', 'Gaming', 'Coding']);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!input.trim()) return;

        // Add user message to UI state only (No AI connected)
        const userMsg = { id: Date.now(), role: 'user', text: input };
        setMessages((prev) => [...prev, userMsg]);
        setInput('');
      };

      const handleNewChat = () => {
        setMessages([]);
      };

      return (
        <div class="flex h-screen w-full bg-slate-950 text-slate-100 overflow-hidden font-sans">
          {/* Sidebar */}
          <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col p-4">
            <div class="flex items-center space-x-2 mb-6">
              <div class="p-2 bg-indigo-600 rounded-lg">
                <span class="text-white font-bold text-sm">✨</span>
              </div>
              <span class="font-bold text-lg tracking-wide text-white">{aiName}</span>
            </div>

            <button 
              onClick={handleNewChat}
              class="flex items-center space-x-2 w-full p-3 bg-slate-800 hover:bg-slate-700 rounded-xl transition text-sm font-medium mb-4"
            >
              <span>+</span>
              <span>New Chat</span>
            </button>

            {/* Chat Mode Selector */}
            <div class="p-3 bg-slate-950/50 rounded-xl border border-slate-800 mb-4">
              <span class="text-xs font-semibold text-slate-400 block mb-2 uppercase">Chat Mode</span>
              <div class="flex space-x-1">
                <button 
                  onClick={() => setIsPrivate(false)} 
                  class={`flex-1 py-1.5 px-2 text-xs rounded-lg transition ${!isPrivate ? 'bg-indigo-600 text-white font-medium' : 'text-slate-400 hover:text-white'}`}
                >
                  Sync Mode
                </button>
                <button 
                  onClick={() => setIsPrivate(true)} 
                  class={`flex-1 py-1.5 px-2 text-xs rounded-lg transition ${isPrivate ? 'bg-amber-600 text-white font-medium' : 'text-slate-400 hover:text-white'}`}
                >
                  Private Mode
                </button>
              </div>
            </div>

            {/* Synced Preferences Panel */}
            <div class="flex-1 overflow-y-auto">
              <div class="text-xs font-semibold text-slate-400 mb-2 uppercase">Synced Preferences</div>
              {isPrivate ? (
                <div class="text-xs text-amber-400/80 bg-amber-950/30 p-2.5 rounded-lg border border-amber-900/40">
                  🔒 Private Chat active. Context and sync are disabled.
                </div>
              ) : (
                <div class="space-y-1">
                  {preferences.map((pref, i) => (
                    <span key={i} class="inline-block bg-slate-800 text-slate-300 text-xs px-2 py-1 rounded-md mr-1 mb-1">
                      #{pref}
                    </span>
                  ))}
                </div>
              )}
            </div>
          </aside>

          {/* Main Chat Area */}
          <main class="flex-1 flex flex-col h-full bg-slate-950">
            {/* Top Bar */}
            <header class="h-14 border-b border-slate-800 flex items-center justify-between px-6">
              <div class="flex items-center space-x-2">
                <span class={`w-2.5 h-2.5 rounded-full ${isPrivate ? 'bg-amber-500' : 'bg-emerald-500'}`}></span>
                <span class="text-sm font-medium text-slate-300">
                  {isPrivate ? 'Incognito Mode' : 'Data Sync Active'}
                </span>
              </div>
              <div class="flex items-center space-x-2">
                <input 
                  type="password" 
                  placeholder="Paste API Key here..." 
                  value={apiKey}
                  onChange={(e) => setApiKey(e.target.value)}
                  class="bg-slate-900 border border-slate-800 text-xs px-3 py-1.5 rounded-lg w-64 focus:outline-none focus:border-indigo-500 text-slate-200"
                />
              </div>
            </header>

            {/* Messages Body */}
            <div class="flex-1 overflow-y-auto p-6 space-y-4">
              {messages.length === 0 ? (
                <div class="h-full flex flex-col items-center justify-center text-center">
                  <div class="p-4 bg-slate-900 rounded-full mb-4 text-2xl">
                    ✨
                  </div>
                  <h2 class="text-2xl font-bold mb-2 text-white">Hello, I'm {aiName}</h2>
                  <p class="text-slate-400 text-sm max-w-md">
                    {isPrivate 
                      ? 'Private Mode active. Messages won\'t update your profile preferences.'
                      : 'Sync Mode active. Your preferences will sync across chats.'}
                  </p>
                </div>
              ) : (
                messages.map((m) => (
                  <div key={m.id} class="flex items-start justify-end space-x-3">
                    <div class="max-w-xl p-3.5 rounded-2xl text-sm leading-relaxed bg-indigo-600 text-white rounded-tr-none">
                      {m.text}
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* Chat Input Bar */}
            <footer class="p-4 border-t border-slate-800">
              <form onSubmit={handleSendMessage} class="max-w-3xl mx-auto relative flex items-center">
                <input 
                  type="text" 
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder={`Type a message...`}
                  class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 pr-12 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
                />
                <button 
                  type="submit" 
                  class="absolute right-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition text-xs font-semibold"
                >
                  Send
                </button>
              </form>
            </footer>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
